<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- Crypto API - a puzzle cube. Cipher as scramble, not a key and not ƒ. -->
  <!-- Top face -->
  <polygon points="16,3 26,8 16,13 6,8" fill="#555" stroke="#666" stroke-width="1"/>
  <line x1="11" y1="5.5" x2="21" y2="10.5" stroke="#666" stroke-width="1"/>
  <line x1="21" y1="5.5" x2="11" y2="10.5" stroke="#666" stroke-width="1"/>
  <!-- Front face -->
  <polygon points="6,8 16,13 16,27 6,22" fill="#333" stroke="#666" stroke-width="1"/>
  <line x1="6" y1="15" x2="16" y2="20" stroke="#666" stroke-width="1"/>
  <line x1="11" y1="10.5" x2="11" y2="24.5" stroke="#666" stroke-width="1"/>
  <!-- Right face -->
  <polygon points="16,13 26,8 26,22 16,27" fill="#555" stroke="#666" stroke-width="1"/>
  <line x1="16" y1="20" x2="26" y2="15" stroke="#666" stroke-width="1"/>
  <line x1="21" y1="10.5" x2="21" y2="24.5" stroke="#666" stroke-width="1"/>
</svg>
